# Key-based SSH access for Muse via a system-level authorized_keys file,
# so it works for whichever local user is created at install time.
# Password SSH logins are off; the local console is the fallback.
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2 /etc/ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
